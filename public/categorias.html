<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Categorías | Repartidores Pandas</title>
    <meta name="description" content="Explora todas las categorías de tiendas y servicios disponibles en La Paz, B.C.S. a través de Repartidores Pandas.">
    <link rel="canonical" href="https://repartidorespandas.com/categorias.html" />
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://repartidorespandas.com/categorias.html">
    <meta property="og:title" content="Explorar Categorías | Repartidores Pandas">
    <meta property="og:description" content="Explora todas las categorías de tiendas y servicios disponibles en La Paz, B.C.S. a través de Repartidores Pandas.">
    <meta property="og:image" content="https://repartidorespandas.com/img/logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://repartidorespandas.com/categorias.html">
    <meta property="twitter:title" content="Explorar Categorías | Repartidores Pandas">
    <meta property="twitter:description" content="Explora todas las categorías de tiendas y servicios disponibles en La Paz, B.C.S. a través de Repartidores Pandas.">
    <meta property="twitter:image" content="https://repartidorespandas.com/img/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' }
                    }
                }
            }
        }
    </script>

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        .glass-panel {
            background: rgba(255, 248, 238, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.15);
        }

        body {
            background: #fff3e0;
        }

        /* Gradiente más intenso para que resalte el texto en tarjetas compactas */
        .card-gradient {
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.5) 50%, rgba(15, 23, 42, 0.2) 100%);
        }
    </style>
</head>

<body class="bg-[#fff3e0] text-slate-800 antialiased overflow-x-hidden min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 transition-all duration-300 shadow-md" style="background: rgba(255, 248, 238, 0.95);"
        id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 group">
                <img src="/img/logo.svg" alt="Logo" class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-contain"
                    onerror="this.style.display='none'">
                <div
                    class="text-[11px] sm:text-xl font-extrabold tracking-tight text-orange-600 uppercase leading-none">
                    REPARTIDORES <span class="text-slate-900 block sm:inline text-[9px] sm:text-xl">PANDAS</span>
                </div>
            </a>

        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 pt-28 pb-16 bg-[#ffe8cc]">

        <div class="max-w-5xl mx-auto px-4 sm:px-6">

            <!-- Encabezado Compacto -->
            <div class="mb-8 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-1 tracking-tight">Categorías</h1>
                    <p class="text-slate-500 text-sm sm:text-base">¿Qué tienes ganas de pedir hoy?</p>
                </div>
                <a href="/directorio.html"
                    class="inline-flex items-center gap-2 text-orange-600 font-bold hover:text-orange-700 transition-colors bg-white px-4 py-2 rounded-xl shadow-sm border border-orange-100 text-sm">
                    <i data-feather="grid" class="w-4 h-4"></i> Ver todo el directorio
                </a>
            </div>

            <!-- Grid de Categorías Dinámico -->
            <div id="gridCategorias"
                class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 auto-rows-[180px] sm:auto-rows-[220px]">
                <!-- Las categorías se cargarán aquí dinámicamente -->
            </div>
        </div>
    </main>

    <!-- Footer Simple -->
    <footer class="bg-white border-t border-orange-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center">
            <p class="text-xs text-slate-400 font-medium">© 2026 Repartidores Pandas.</p>
        </div>
    </footer>

    <script>
        feather.replace();

        const CATEGORIAS_CONFIG = [
            { id: 'restaurante', nombre: 'Restaurantes y Comida', icon: '🍔', img: 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?q=80&w=800&auto=format&fit=crop', color: 'bg-orange-500' },
            { id: 'carniceria', nombre: 'Carnicería y Pollería', icon: '🥩', img: 'https://images.unsplash.com/photo-1558030006-450675393462?q=80&w=800&auto=format&fit=crop', color: 'bg-red-500' },
            { id: 'abarrotes', nombre: 'Abarrotes y Tiendas', icon: '🛒', img: 'https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=800&auto=format&fit=crop', color: 'bg-green-600' },
            { id: 'farmacia', nombre: 'Farmacia y Salud', icon: '💊', img: 'https://images.unsplash.com/photo-1586015555751-63bb77f4322a?q=80&w=800&auto=format&fit=crop', color: 'bg-blue-500' },
            { id: 'boutique', nombre: 'Boutique y Ropa', icon: '👗', img: 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=800&auto=format&fit=crop', color: 'bg-pink-500' },
            { id: 'reposteria', nombre: 'Repostería y Panadería', icon: '🧁', img: 'https://images.unsplash.com/photo-1551024601-bec78aea704b?q=80&w=800&auto=format&fit=crop', color: 'bg-amber-500' },
            { id: 'tecnologia', nombre: 'Tecnología y Celulares', icon: '💻', img: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=800&auto=format&fit=crop', color: 'bg-slate-700' },
            { id: 'servicios', nombre: 'Servicios y Otros', icon: '🛠️', img: 'https://images.unsplash.com/photo-1581578731522-7b7547c6a21f?q=80&w=800&auto=format&fit=crop', color: 'bg-indigo-500' }
        ];

        async function cargarCategoriasReales() {
            try {
                const response = await fetch('/api/negocios');
                const negocios = await response.json();

                const conteo = negocios.reduce((acc, n) => {
                    if (n.categoria) acc[n.categoria] = (acc[n.categoria] || 0) + 1;
                    return acc;
                }, {});

                const grid = document.getElementById('gridCategorias');
                grid.innerHTML = CATEGORIAS_CONFIG.map(cat => {
                    const total = conteo[cat.id] || 0;
                    const btnText = total > 0 ? `Ver ${total} locales` : 'Próximamente';
                    const link = total > 0 ? `/directorio.html?cat=${cat.id}` : '#';

                    return `
                    <a href="${link}" class="relative rounded-[2rem] overflow-hidden group shadow-sm border border-white hover:shadow-lg transition-all">
                        <img src="${cat.img}" alt="${cat.nombre}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105">
                        <div class="absolute inset-0 card-gradient"></div>
                        <div class="absolute inset-0 p-6 flex flex-col items-center justify-center text-center">
                            <span class="text-4xl mb-2 transform group-hover:scale-110 transition-transform">${cat.icon}</span>
                            <h2 class="text-2xl sm:text-3xl font-black text-white tracking-wide drop-shadow-lg mb-2">${cat.nombre}</h2>
                            <div class="${cat.color} text-white font-bold px-5 py-2 rounded-full text-xs shadow-lg transform translate-y-2 opacity-0 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
                                ${btnText}
                            </div>
                        </div>
                    </a>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error cargando categorías:", error);
            }
        }

        cargarCategoriasReales();

        cargarCategoriasReales();
    </script>
</body>

</html>
