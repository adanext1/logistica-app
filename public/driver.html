<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver App | Repartidores Pandas</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' } } } }
        }
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* Deshabilitar text selection para que parezca una App nativa */
        body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- HEADER FLOTANTE -->
    <header class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center shadow-lg z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center font-black text-xl shadow-inner border border-brand-400" id="driverInitials">
                RP
            </div>
            <div>
                <p class="text-[10px] text-brand-300 font-bold uppercase tracking-widest">Conectado</p>
                <h1 class="font-extrabold text-lg leading-tight" id="driverName">Repartidor</h1>
            </div>
        </div>
        <button onclick="cerrarSesionDriver()" class="bg-white/10 p-2.5 rounded-xl text-white hover:bg-red-500 transition-colors active:scale-95">
            <i data-feather="log-out" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- LISTA DE PEDIDOS (RADAR) -->
    <main class="flex-1 overflow-y-auto p-4 pb-10 relative">
        <div class="flex justify-between items-end mb-4 px-1">
            <h2 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                <i data-feather="target" class="text-brand-500"></i> Radar
            </h2>
            <span class="bg-brand-100 text-brand-700 text-xs font-bold px-3 py-1 rounded-full border border-brand-200 shadow-sm flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span> <span id="contadorPedidos">0</span>
            </span>
        </div>

        <div id="listaRadar" class="space-y-4">
            <!-- Loading State -->
            <div class="text-center py-10">
                <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-brand-500 mx-auto mb-4"></div>
                <p class="text-slate-500 font-bold">Buscando envíos...</p>
            </div>
        </div>
    </main>

    <!-- MODAL DETALLE DE PEDIDO (PANTALLA COMPLETA) -->
    <div id="modalPedidoOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col justify-end">
        <div id="modalPedidoContent" class="bg-white w-full rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-300 flex flex-col max-h-[90vh]">
            
            <!-- Handleizer superior -->
            <div class="w-full flex justify-center py-3 shrink-0" onclick="cerrarModalPedido()">
                <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
            </div>

            <div class="px-6 pb-6 overflow-y-auto flex-1">
                <!-- Info Header -->
                <div class="text-center mb-6">
                    <p class="text-brand-600 font-bold text-sm tracking-widest uppercase mb-1" id="modalNegocio">Comercio</p>
                    <h3 class="text-3xl font-black text-slate-900 leading-tight" id="modalCliente">Cliente</h3>
                    <p class="text-slate-500 font-medium mt-1 flex items-center justify-center gap-1.5"><i data-feather="phone" class="w-4 h-4"></i> <span id="modalTelefono"></span></p>
                </div>

                <!-- Dirección Destacada -->
                <div class="bg-slate-50 rounded-3xl p-5 border border-slate-200 mb-6 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-3 opacity-10 pointer-events-none"><i data-feather="map-pin" class="w-20 h-20"></i></div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Entregar en:</p>
                    <p class="text-lg font-bold text-slate-800 leading-snug relative z-10" id="modalDireccion"></p>
                </div>

                <!-- Costo de Envío -->
                <div class="flex items-center justify-between bg-green-50 rounded-2xl p-4 border border-green-200 mb-6">
                    <span class="font-bold text-green-800 flex items-center gap-2"><i data-feather="dollar-sign" class="w-5 h-5"></i> Costo Envío</span>
                    <span class="text-2xl font-black text-green-600" id="modalCosto"></span>
                </div>

                <!-- Botones de Acción Mapeados -->
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <a href="#" id="btnLlamar" class="bg-white border-2 border-slate-200 text-slate-700 font-bold py-4 rounded-2xl text-center active:bg-slate-100 transition-colors shadow-sm flex flex-col items-center justify-center gap-1">
                        <i data-feather="phone-call" class="w-6 h-6"></i>
                        <span class="text-[11px] uppercase tracking-wider mt-1">Llamar</span>
                    </a>
                    <a href="#" id="btnWhatsApp" target="_blank" class="bg-white border-2 border-green-200 text-green-600 font-bold py-4 rounded-2xl text-center active:bg-green-50 transition-colors shadow-sm flex flex-col items-center justify-center gap-1">
                        <i data-feather="message-circle" class="w-6 h-6"></i>
                        <span class="text-[11px] uppercase tracking-wider mt-1">WhatsApp</span>
                    </a>
                </div>

                <!-- Botón Gigante MAPS -->
                <a href="#" id="btnMaps" target="_blank" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl flex justify-center items-center gap-3 text-lg mb-4 shadow-xl shadow-slate-900/30 active:scale-95 transition-transform">
                    <i data-feather="map" class="w-6 h-6 text-brand-400"></i> INICIAR RUTA GPS
                </a>

                <!-- Botón Gigante ENTREGADO -->
                <button id="btnEntregado" class="w-full bg-green-500 text-white font-black py-5 rounded-2xl flex justify-center items-center gap-3 text-lg shadow-xl shadow-green-500/30 active:scale-95 transition-transform mt-6 border-b-4 border-green-700">
                    <i data-feather="check-circle" class="w-7 h-7"></i> MARCAR ENTREGADO
                </button>
            </div>
        </div>
    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="fixed top-20 inset-x-4 bg-slate-900 text-white font-bold px-6 py-4 rounded-2xl shadow-2xl transform -translate-y-20 opacity-0 transition-all duration-300 z-[100] text-center pointer-events-none">
        Mensaje aquí
    </div>

    <script src="/js/driver.js"></script>
</body>
</html>
