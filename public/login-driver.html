<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repartidores Camino Real | Acceso Conductor</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' } } } }
        }
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="bg-slate-900 font-sans flex items-center justify-center min-h-screen relative overflow-hidden">
    <!-- Fondo decorativo -->
    <div class="absolute top-0 inset-x-0 h-64 bg-gradient-to-b from-brand-600 to-transparent opacity-20"></div>

    <div class="w-full max-w-sm px-6 relative z-10">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-brand-600 rounded-3xl mx-auto flex items-center justify-center shadow-xl shadow-brand-600/30 mb-6 transform -rotate-6">
                <i data-feather="navigation" class="w-10 h-10 text-white transform rotate-6"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">Portal<br><span class="text-brand-500">Conductores</span></h1>
            <p class="text-slate-400 mt-2 font-medium">Inicia sesión para comenzar tu ruta.</p>
        </div>

        <form id="driverLoginForm" class="bg-white p-6 rounded-3xl shadow-2xl space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">Teléfono (WhatsApp)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-feather="phone" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <input type="tel" id="telefono" required pattern="[0-9]{10}" maxlength="10" placeholder="10 dígitos" class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none bg-slate-50 transition-all text-lg font-bold text-slate-900 tracking-wider">
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">PIN de Acceso</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-feather="lock" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <input type="password" id="pin" required pattern="[0-9]{4,6}" maxlength="6" placeholder="****" class="w-full pl-11 pr-4 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none bg-slate-50 transition-all text-center tracking-[0.5em] text-2xl font-black text-slate-900">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-brand-600/30 transition-all flex items-center justify-center gap-2 mt-4 text-lg">
                <i data-feather="log-in" class="w-5 h-5"></i> Entrar
            </button>
            <p id="errorMsg" class="text-red-500 text-sm text-center font-bold mt-3 hidden"></p>
        </form>
    </div>

    <script>
        feather.replace();

        // Si ya hay token de driver, redirigir
        if (localStorage.getItem('driver_token')) {
            window.location.href = '/driver.html';
        }

        document.getElementById('driverLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const errorMsg = document.getElementById('errorMsg');
            const originalHtml = btn.innerHTML;
            
            const telefono = document.getElementById('telefono').value;
            const pin = document.getElementById('pin').value;

            btn.innerHTML = '<div class="animate-spin rounded-full h-6 w-6 border-b-2 border-white mx-auto"></div>';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/driver/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefono, pin })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('driver_token', data.token);
                    localStorage.setItem('driver_info', JSON.stringify(data.repartidor));
                    window.location.href = '/driver.html';
                } else {
                    errorMsg.innerText = data.error || 'Error al iniciar sesión';
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.innerText = 'Error de conexión';
                errorMsg.classList.remove('hidden');
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
