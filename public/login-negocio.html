<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Portal de Negocios | Camino Real</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#a39989",
                        "on-secondary-fixed-variant": "#7f2b00",
                        "on-surface": "#251913",
                        "secondary-container": "#fd651e",
                        "on-tertiary-fixed": "#201b10",
                        "inverse-on-surface": "#ffede6",
                        "secondary": "#a73a00",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#ffb690",
                        "surface-tint": "#9d4300",
                        "secondary-fixed": "#ffdbce",
                        "on-primary-fixed": "#341100",
                        "primary-container": "#f97316",
                        "on-background": "#251913",
                        "tertiary-fixed-dim": "#d0c5b3",
                        "on-tertiary-fixed-variant": "#4d4638",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ede1cf",
                        "on-tertiary-container": "#383125",
                        "surface-container-low": "#fff1eb",
                        "surface-container-high": "#fce3d9",
                        "outline": "#8c7164",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#e0c0b1",
                        "inverse-surface": "#3c2d26",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#370e00",
                        "background": "#fff8f6",
                        "tertiary": "#655d4f",
                        "surface-container-highest": "#f6ded3",
                        "on-primary-container": "#582200",
                        "primary": "#9d4300",
                        "surface-dim": "#edd5cb",
                        "secondary-fixed-dim": "#ffb599",
                        "surface-bright": "#fff8f6",
                        "primary-fixed": "#ffdbca",
                        "surface-variant": "#f6ded3",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#571a00",
                        "surface": "#fff8f6",
                        "on-primary-fixed-variant": "#783200",
                        "surface-container": "#ffeae0",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#ffb690",
                        "on-surface-variant": "#584237",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "h1": ["Outfit"],
                        "h2": ["Outfit"],
                        "caption": ["Outfit"],
                        "body-md": ["Outfit"],
                        "label-sm": ["Outfit"],
                        "h3": ["Outfit"],
                        "body-lg": ["Outfit"]
                    },
                    "fontSize": {
                        "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "h2": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "h3": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body
    class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 antialiased relative overflow-hidden">

    <div
        class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[100px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-secondary-container/20 rounded-full blur-[80px] pointer-events-none">
    </div>

    <div
        class="w-full max-w-[420px] bg-surface-container-lowest rounded-[2rem] shadow-xl shadow-primary/5 border border-outline-variant/50 relative z-10 overflow-hidden">

        <div class="px-8 pt-10 pb-6 text-center">
            <div
                class="w-16 h-16 mx-auto bg-primary-container text-on-primary-container rounded-2xl flex items-center justify-center mb-6 shadow-md shadow-primary/10 rotate-3">
                <span class="material-symbols-outlined text-[36px]"
                    style="font-variation-settings: 'FILL' 1;">storefront</span>
            </div>
            <h1 class="font-h2 text-h2 text-on-surface mb-2">Panel De Negocios</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Ingresa para administrar tu catálogo, ver tus
                ventas y gestionar tu negocio en Camino Real.</p>
            
            <!-- Mensaje de Error -->
            <div id="errorMessage" class="hidden mt-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm font-medium">
                Usuario o PIN incorrectos. Intenta de nuevo.
            </div>
        </div>

        <form action="/api/login-negocio" method="POST" class="px-8 pb-10 flex flex-col gap-5">

            <div class="flex flex-col gap-2">
                <label for="username" class="font-label-sm text-label-sm text-on-surface-variant ml-1">Usuario del
                    Negocio</label>
                <div class="relative">
                    <span
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70">badge</span>
                    <input type="text" id="username" name="username" placeholder="ej. talamantes" required
                        autocomplete="username"
                        class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-md text-body-md rounded-xl pl-12 pr-4 py-3.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50 lowercase">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center ml-1">
                    <label for="password" class="font-label-sm text-label-sm text-on-surface-variant">Contraseña</label>
                    <a href="https://wa.me/526121234567?text=Hola,%20tengo%20problemas%20para%20entrar%20a%20mi%20panel%20de%20negocio."
                        target="_blank"
                        class="font-caption text-caption text-primary hover:text-surface-tint font-medium transition-colors">¿Problemas
                        para entrar?</a>
                </div>
                <div class="relative">
                    <span
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70">lock</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-md text-body-md rounded-xl pl-12 pr-4 py-3.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-primary text-on-primary font-label-sm text-label-sm text-lg py-4 rounded-full mt-2 hover:bg-surface-tint hover:shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Ingresar al panel
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>

            <div class="mt-4 pt-6 border-t border-outline-variant/30 text-center">
                <p class="font-caption text-caption text-on-surface-variant">
                    ¿Aún no eres parte de la red? <br>
                    <a href="https://wa.me/526121234567?text=Hola,%20me%20interesa%20registrar%20mi%20negocio%20en%20Camino%20Real"
                        target="_blank" class="text-primary font-medium hover:underline mt-1 inline-block">Contacta a un
                        asesor para registrar tu negocio</a>
                </p>
            </div>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalBtnHtml = btn.innerHTML;
            const errorMsg = document.getElementById('errorMessage');
            
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mx-auto"></div>';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login-negocio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al iniciar sesión');
                }

                // Guardar datos en localStorage
                localStorage.setItem('negocio_id', data.negocio.id);
                localStorage.setItem('negocio_token', data.token);
                localStorage.setItem('negocio_slug', data.negocio.slug);
                localStorage.setItem('negocio_nombre', data.negocio.nombre);

                // Redirigir al dashboard
                window.location.href = '/nd/dashboard.html';

            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
            }
        });

        // Mostrar error si viene en la URL (legacy support)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid') {
            document.getElementById('errorMessage').classList.remove('hidden');
        }
    </script>
</body>

</html>
