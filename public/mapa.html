<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Comercios | Repartidores Camino Real</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body { margin: 0; font-family: 'Outfit', sans-serif; background: #fff3e0; }
        #mapa { width: 100%; height: 100vh; z-index: 1; }

        .panel-overlay {
            background: rgba(255, 248, 238, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .negocio-card { transition: all 0.2s ease; }
        .negocio-card:hover, .negocio-card.active { background: #fff7ed; border-color: #fb923c; }
    </style>
</head>

<body class="overflow-hidden">

    <!-- MAPA FULLSCREEN -->
    <div id="mapa"></div>

    <!-- TOP BAR (Flotante sobre el mapa) -->
    <div class="fixed top-0 left-0 right-0 z-[1000] p-3 sm:p-4">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <!-- Botón Volver -->
            <a href="/directorio.html" class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center text-slate-700 hover:bg-orange-50 transition-colors flex-shrink-0 border border-slate-100">
                <i data-feather="arrow-left" class="w-5 h-5"></i>
            </a>

            <!-- Barra de Búsqueda -->
            <div class="flex-1 relative">
                <input type="text" id="searchInput" placeholder="Buscar negocio en el mapa..."
                    class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-white shadow-lg border border-slate-100 text-sm font-medium focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all">
                <i data-feather="search" class="w-5 h-5 text-slate-400 absolute left-4 top-4"></i>
            </div>

            <!-- Botón Mi Ubicación -->
            <button id="btnUbicacion" class="w-12 h-12 bg-orange-500 hover:bg-orange-600 rounded-xl shadow-lg flex items-center justify-center text-white transition-colors flex-shrink-0">
                <i data-feather="crosshair" class="w-5 h-5"></i>
            </button>

            <!-- Botón Login -->
            <a href="/login-cliente.html" class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center text-slate-700 hover:bg-orange-50 transition-colors flex-shrink-0 border border-slate-100">
                <i data-feather="user" class="w-5 h-5"></i>
            </a>
        </div>
    </div>

    <!-- PANEL INFERIOR (Lista de Negocios - Estilo Bottom Sheet) -->
    <div id="panelNegocios" class="fixed bottom-0 left-0 right-0 z-[1000] panel-overlay rounded-t-[2rem] shadow-2xl border-t border-orange-200 transition-all duration-500 ease-out" style="max-height: 45vh;">

        <!-- Handle para arrastrar -->
        <div class="flex justify-center pt-3 pb-2 cursor-pointer" id="panelHandle">
            <div class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
        </div>

        <!-- Header del panel -->
        <div class="px-4 sm:px-6 pb-3 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-extrabold text-slate-900">Negocios en La Paz</h2>
                <p id="contadorMapa" class="text-xs text-slate-500 font-medium">Cargando...</p>
            </div>
            <button id="btnTogglePanel" class="w-10 h-10 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center hover:bg-orange-100 transition-colors">
                <i data-feather="chevron-down" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Lista scrollable horizontal -->
        <div id="listaNegociosContainer" class="overflow-x-auto hide-scrollbar px-4 sm:px-6 pb-6" style="max-height: calc(45vh - 90px);">
            <div id="listaNegocios" class="flex gap-3 sm:gap-4">
                <!-- Skeletons -->
                <div class="animate-pulse bg-orange-50 rounded-2xl border border-orange-100 w-36 h-44 sm:w-44 sm:h-52 flex-shrink-0"></div>
                <div class="animate-pulse bg-orange-50 rounded-2xl border border-orange-100 w-36 h-44 sm:w-44 sm:h-52 flex-shrink-0"></div>
                <div class="animate-pulse bg-orange-50 rounded-2xl border border-orange-100 w-36 h-44 sm:w-44 sm:h-52 flex-shrink-0"></div>
            </div>
        </div>
    </div>

    <script>
        feather.replace();

        // --- Mapa ---
        const map = L.map('mapa', {
            zoomControl: false,
            tap: false
        }).setView([24.1426, -110.3127], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Zoom en esquina inferior derecha (solo desktop)
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // --- Mi Ubicación ---
        document.getElementById('btnUbicacion').addEventListener('click', () => {
            if (!navigator.geolocation) return alert('Tu navegador no soporta GPS');
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;
                map.setView([latitude, longitude], 15, { animate: true });

                // Marcador de usuario
                const userIcon = L.divIcon({
                    className: 'bg-transparent',
                    html: `<div class="w-5 h-5 bg-blue-500 rounded-full border-4 border-white shadow-lg shadow-blue-500/50 animate-pulse"></div>`,
                    iconSize: [20, 20], iconAnchor: [10, 10]
                });
                L.marker([latitude, longitude], { icon: userIcon }).addTo(map).bindPopup('<b class="text-sm">Tú estás aquí</b>');
            }, () => alert('No pudimos obtener tu ubicación.'));
        });

        // --- Panel Toggle ---
        let panelExpanded = true;
        const panel = document.getElementById('panelNegocios');

        function togglePanel() {
            panelExpanded = !panelExpanded;
            panel.style.maxHeight = panelExpanded ? '45vh' : '80px';
            document.getElementById('btnTogglePanel').innerHTML = panelExpanded
                ? '<i data-feather="chevron-down" class="w-5 h-5"></i>'
                : '<i data-feather="chevron-up" class="w-5 h-5"></i>';
            feather.replace();
        }

        document.getElementById('btnTogglePanel').addEventListener('click', togglePanel);
        document.getElementById('panelHandle').addEventListener('click', togglePanel);

        // --- Datos ---
        let todosLosNegocios = [];
        let markers = {};

        const fotosPlaceholders = [
            'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1552566626-52f8b828add9?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80'
        ];

        function renderizarLista(negocios) {
            const lista = document.getElementById('listaNegocios');
            lista.innerHTML = '';
            document.getElementById('contadorMapa').textContent =
                negocios.length === 0 ? 'Sin resultados' : `${negocios.length} negocio${negocios.length !== 1 ? 's' : ''} encontrado${negocios.length !== 1 ? 's' : ''}`;

            if (negocios.length === 0) {
                lista.innerHTML = `<div class="text-center py-6 text-slate-500 text-sm font-medium w-full">No se encontraron negocios.</div>`;
                return;
            }

            negocios.forEach((n, index) => {
                const foto = fotosPlaceholders[index % fotosPlaceholders.length];
                const card = document.createElement('a');
                card.href = `/${n.slug}`;
                card.className = 'relative w-36 h-44 sm:w-44 sm:h-52 rounded-2xl overflow-hidden flex-shrink-0 group shadow-sm border border-white cursor-pointer hover:shadow-lg transition-all';

                const logoHtml = n.logo_url
                    ? `<img src="${n.logo_url}" class="w-9 h-9 rounded-lg object-cover border-2 border-white shadow-md bg-white">`
                    : `<div class="w-9 h-9 rounded-lg bg-orange-100 text-orange-600 font-black text-sm flex items-center justify-center border-2 border-white shadow-md">${n.nombre_comercial.charAt(0)}</div>`;

                card.innerHTML = `
                    <img src="${foto}" alt="${n.nombre_comercial}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/30 to-transparent"></div>
                    <div class="absolute top-2 left-2">
                        <span class="bg-green-500/90 text-white text-[8px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded flex items-center gap-0.5">
                            <i data-feather="check-circle" class="w-2 h-2"></i> Activo
                        </span>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-3">
                        <div class="flex items-center gap-2 mb-1">
                            ${logoHtml}
                            <h3 class="text-sm font-extrabold text-white leading-tight truncate flex-1">${n.nombre_comercial}</h3>
                        </div>
                        <p class="text-[9px] text-orange-200 flex items-center gap-1">
                            <i data-feather="map-pin" class="w-2 h-2"></i> La Paz
                        </p>
                    </div>
                `;

                // Al tocar/hover, centrar mapa
                card.addEventListener('mouseenter', () => {
                    if (n.lat && n.lng) {
                        map.setView([n.lat, n.lng], 16, { animate: true, duration: 0.5 });
                        if (markers[n.slug]) markers[n.slug].openPopup();
                    }
                });

                lista.appendChild(card);
            });
            feather.replace();
        }

        async function cargarNegocios() {
            try {
                const response = await fetch('/api/negocios');
                todosLosNegocios = await response.json();

                const bounds = L.latLngBounds();

                todosLosNegocios.forEach(n => {
                    if (!n.lat || !n.lng) return;

                    const inicialPin = n.nombre_comercial.charAt(0).toUpperCase();
                    const logoElement = n.logo_url ? `<img src="${n.logo_url}" class="w-full h-full object-cover">` : inicialPin;

                    const customIcon = L.divIcon({
                        className: 'bg-transparent border-none',
                        html: `
                            <div class="relative flex flex-col items-center group cursor-pointer" style="filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));">
                                <div class="bg-slate-900 rounded-2xl px-3 py-2 flex items-center gap-2.5 transition-transform group-hover:scale-110 border border-slate-700">
                                    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 text-white flex items-center justify-center font-black text-xs overflow-hidden shadow-inner flex-shrink-0">
                                        ${logoElement}
                                    </div>
                                    <span class="font-bold text-white text-xs whitespace-nowrap tracking-tight">${n.nombre_comercial}</span>
                                    <span class="w-2.5 h-2.5 rounded-full bg-green-400 flex-shrink-0 animate-pulse shadow-sm shadow-green-400/50"></span>
                                </div>
                                <div class="w-3 h-3 bg-slate-900 transform rotate-45 -mt-2 border-b border-r border-slate-700"></div>
                            </div>
                        `,
                        iconSize: [160, 58],
                        iconAnchor: [80, 56]
                    });

                    const marker = L.marker([n.lat, n.lng], { icon: customIcon }).addTo(map);
                    const popupContent = `
                        <div class="text-center pb-1 min-w-[140px]">
                            <strong class="block text-slate-900 mb-2 border-b border-slate-100 pb-1 text-sm font-bold">${n.nombre_comercial}</strong>
                            <a href="/${n.slug}" class="inline-flex items-center justify-center gap-1.5 bg-orange-50 text-orange-700 text-xs px-4 py-2 rounded-xl font-bold hover:bg-orange-100 transition-colors w-full border border-orange-200 shadow-sm">
                                <i data-feather="shopping-bag" class="w-3.5 h-3.5"></i> Ver Tienda
                            </a>
                        </div>
                    `;
                    marker.bindPopup(popupContent, { closeButton: false, minWidth: 140 });
                    marker.on('click', () => { window.location.href = `/${n.slug}`; });
                    markers[n.slug] = marker;
                    bounds.extend([n.lat, n.lng]);
                });

                renderizarLista(todosLosNegocios);

                if (bounds.isValid()) {
                    setTimeout(() => map.fitBounds(bounds, { padding: [60, 60], maxZoom: 14, animate: true }), 300);
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('listaNegocios').innerHTML = `<div class="text-center py-6 text-red-500 font-bold text-sm">Error al cargar negocios.</div>`;
            }
        }

        // --- Buscador ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtrados = todosLosNegocios.filter(n => n.nombre_comercial.toLowerCase().includes(term));
            renderizarLista(filtrados);

            // Si hay un solo resultado, centrar en él
            if (filtrados.length === 1 && filtrados[0].lat && filtrados[0].lng) {
                map.setView([filtrados[0].lat, filtrados[0].lng], 16, { animate: true });
                if (markers[filtrados[0].slug]) markers[filtrados[0].slug].openPopup();
            }
        });

        cargarNegocios();
    </script>
</body>
</html>
